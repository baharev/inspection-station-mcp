[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inspection-mcp-client"
version = "1.0.0"
description = "A desktop window where Claude inspects parts with a camera through MCP, and a person confirms every fail"
license = "MIT"
requires-python = ">=3.13"   # tested with 3.13 and 3.14 on Linux and Windows
dependencies = [
    "mcp>=2.3,<3",
    "anthropic>=1.15,<2",
    "httpx2>=2.13,<3",
    "pydantic>=2.14,<3",
    "PySide6-Essentials>=6.12,<7",
]

[project.scripts]
inspection-client = "inspection_client.app:main"

[project.optional-dependencies]
# The tests need no camera server: they use a stand-in (tests/stand_in_server.py).
test = ["pytest>=9.1,<10", "anyio>=4.15,<5", "pillow>=12.3,<13"]
dev = ["ruff==0.17.1", "mypy==2.4.0"]

[tool.setuptools]
packages = ["inspection_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = [".", "tests"]   # tests/stand_in_server.py is imported as stand_in_server

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
files = ["inspection_client"]
