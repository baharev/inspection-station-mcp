<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 754" width="1100" height="754"
     font-family="'Segoe UI', 'Helvetica Neue', Arial, 'Liberation Sans', sans-serif" fill="#2d333b">
  <title>The demo's setup: an inspection station with a camera, an operator's computer, and Claude</title>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2f6fb5"/>
    </marker>
    <marker id="clay" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#b5643f"/>
    </marker>
    <g id="tray">
      <rect x="0" y="0" width="70" height="18" rx="5" fill="#ee8a3a" stroke="#b9601c" stroke-width="1.5"/>
      <rect x="8" y="6" width="22" height="5" rx="2" fill="#3b4452"/>
      <rect x="36" y="5" width="7" height="8" rx="2" fill="#3b4452"/>
      <rect x="48" y="7" width="15" height="4" rx="2" fill="#3b4452"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1100" height="754" rx="14" fill="#ffffff"/>

  <!-- The inspection station -->
  <rect x="20" y="20" width="540" height="714" rx="12" fill="#f4efe4" stroke="#e2d9c6"/>
  <text x="40" y="54" font-size="21" font-weight="700">Inspection station on the production line</text>
  <text x="40" y="92" font-size="21" font-weight="700">No AI runs here</text>

  <!-- camera on its stand, looking down at the part -->
  <line x1="120" y1="519" x2="120" y2="172" stroke="#3b4452" stroke-width="7" stroke-linecap="round"/>
  <line x1="120" y1="174" x2="236" y2="174" stroke="#3b4452" stroke-width="7" stroke-linecap="round"/>
  <polygon points="238,222 262,222 313,520 187,520" fill="#ffcf5a" opacity="0.35"/>
  <rect x="222" y="168" width="56" height="40" rx="7" fill="#3b4452"/>
  <circle cx="250" cy="214" r="10" fill="#7b8aa0" stroke="#3b4452" stroke-width="3"/>
  <text x="290" y="186" font-size="16" font-weight="700">camera</text>

  <!-- the camera computer -->
  <path d="M390 324 C 330 324, 320 188, 278 188" fill="none" stroke="#5c6470" stroke-width="2.5"/>
  <rect x="390" y="284" width="140" height="82" rx="6" fill="#dfe9f5" stroke="#2d333b" stroke-width="2"/>
  <text x="460" y="320" font-size="14" font-weight="700" text-anchor="middle">MCP server</text>
  <text x="460" y="340" font-size="12" text-anchor="middle" fill="#55606e">limits the AI</text>
  <path d="M380 366 L540 366 L550 380 L370 380 z" fill="#c9d3df" stroke="#2d333b" stroke-width="2"/>
  <text x="460" y="406" font-size="16" font-weight="700" text-anchor="middle">Station computer</text>
  <text x="460" y="426" font-size="13" text-anchor="middle">takes the photos,</text>
  <text x="460" y="443" font-size="13" text-anchor="middle">keeps the inspection log</text>

  <!-- conveyor belt with parts -->
  <line x1="80" y1="541" x2="80" y2="572" stroke="#3b4452" stroke-width="4"/>
  <line x1="520" y1="541" x2="520" y2="572" stroke="#3b4452" stroke-width="4"/>
  <rect x="40" y="519" width="510" height="22" rx="11" fill="#d6d1c4" stroke="#3b4452" stroke-width="2"/>
  <g fill="#f4efe4" stroke="#3b4452" stroke-width="1.5">
    <circle cx="56" cy="530" r="6"/><circle cx="124" cy="530" r="6"/><circle cx="192" cy="530" r="6"/>
    <circle cx="260" cy="530" r="6"/><circle cx="328" cy="530" r="6"/><circle cx="396" cy="530" r="6"/>
    <circle cx="464" cy="530" r="6"/><circle cx="532" cy="530" r="6"/>
  </g>
  <use href="#tray" x="45" y="501"/>
  <use href="#tray" x="215" y="501"/>
  <use href="#tray" x="430" y="501"/>
  <text x="300" y="564" font-size="13" text-anchor="middle" fill="#55606e">conveyor belt →</text>

  <!-- the three outcomes -->
  <text x="40" y="604" font-size="16" font-weight="700">Each part gets one outcome, recorded in the log:</text>
  <g>
    <rect x="40" y="628" width="160" height="94" rx="10" fill="#ffffff" stroke="#2e8b57" stroke-width="2"/>
    <circle cx="66" cy="656" r="15" fill="#2e8b57"/>
    <path d="M58 656 L64 662 L75 649" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="90" y="662" font-size="18" font-weight="700" fill="#2e8b57">Pass</text>
    <text x="54" y="692" font-size="13">moves on</text>
  </g>
  <g>
    <rect x="210" y="628" width="160" height="94" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
    <circle cx="236" cy="656" r="15" fill="#c0392b"/>
    <path d="M229 649 L243 663 M243 649 L229 663" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round"/>
    <text x="260" y="662" font-size="18" font-weight="700" fill="#c0392b">Fail</text>
    <text x="224" y="692" font-size="13">off the line,</text>
    <text x="224" y="709" font-size="13">after a person's yes</text>
  </g>
  <g>
    <rect x="380" y="628" width="160" height="94" rx="10" fill="#ffffff" stroke="#c98a0b" stroke-width="2"/>
    <circle cx="406" cy="656" r="15" fill="#d4910f"/>
    <text x="406" y="663" font-size="20" font-weight="700" fill="#ffffff" text-anchor="middle">?</text>
    <text x="430" y="662" font-size="18" font-weight="700" fill="#b07506">Unsure</text>
    <text x="394" y="692" font-size="13">put aside for</text>
    <text x="394" y="709" font-size="13">a person</text>
  </g>

  <!-- the operator's computer -->
  <rect x="700" y="180" width="380" height="554" rx="12" fill="#eaf0f7" stroke="#d3deea"/>
  <text x="716" y="212" font-size="21" font-weight="700">Operator's computer</text>
  <text x="716" y="232" font-size="13" fill="#55606e">the desktop app</text>
  
  <rect x="800" y="245" width="260" height="160" rx="9" fill="#3b4452"/>
  <rect x="810" y="255" width="240" height="140" rx="3" fill="#ffffff"/>
  <rect x="818" y="263" width="100" height="66" rx="3" fill="#dfe3e8"/>
  <use href="#tray" x="833" y="287"/>
  <g fill="#cfd6df">
    <rect x="928" y="266" width="112" height="7" rx="3"/>
    <rect x="928" y="280" width="90" height="7" rx="3"/>
    <rect x="928" y="294" width="104" height="7" rx="3"/>
    <rect x="928" y="308" width="70" height="7" rx="3"/>
  </g>
  <rect x="852" y="330" width="186" height="58" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="945" y="348" font-size="12" font-weight="700" text-anchor="middle">Mark tray-07 as FAILED?</text>
  <rect x="864" y="358" width="74" height="22" rx="4" fill="#fbe1de" stroke="#c0392b"/>
  <text x="901" y="373" font-size="11" text-anchor="middle">Yes, failed</text>
  <rect x="948" y="358" width="80" height="22" rx="4" fill="#eef1f5" stroke="#8a95a3"/>
  <text x="988" y="373" font-size="11" text-anchor="middle">No, put aside</text>
  <rect x="920" y="405" width="20" height="22" fill="#3b4452"/>
  <rect x="888" y="426" width="84" height="7" rx="3" fill="#3b4452"/>
  <rect x="716" y="433" width="352" height="9" rx="3" fill="#b9a68a"/>
  <line x1="736" y1="442" x2="736" y2="510" stroke="#9c8a70" stroke-width="5"/>
  <line x1="1048" y1="442" x2="1048" y2="510" stroke="#9c8a70" stroke-width="5"/>

  <!-- the operator, seen from behind, and the question -->
  <path d="M832 540 C 832 502, 852 492, 880 492 C 908 492, 928 502, 928 540 Z" fill="#6f84a3"/>
  <circle cx="880" cy="464" r="25" fill="#8a9bb5"/>
  <path d="M716 452 h112 a10 10 0 0 1 10 10 v12 l14 8 l-14 8 v12 a10 10 0 0 1 -10 10 h-112 a10 10 0 0 1 -10 -10 v-40 a10 10 0 0 1 10 -10 z"
        fill="#ffffff" stroke="#2d333b" stroke-width="2"/>
  <text x="771" y="476" font-size="14" text-anchor="middle">“Is the tray</text>
  <text x="771" y="494" font-size="14" text-anchor="middle">complete?”</text>

  <text x="716" y="600" font-size="16" font-weight="700">The operator</text>
  <text x="716" y="622" font-size="14">asks in plain words,</text>
  <text x="716" y="641" font-size="14">confirms every fail</text>
  <!-- Claude -->
  <path transform="translate(884 70) scale(1.25) translate(-884 -67)" d="M800 112 C 772 112, 766 78, 792 70 C 790 42, 828 30, 846 48 C 860 22, 906 22, 918 46
           C 940 30, 978 40, 976 66 C 1004 70, 1002 112, 974 112 Z"
        fill="#fbf1ec" stroke="#b5643f" stroke-width="2"/>
  <text x="884" y="66" font-size="22" font-weight="700" text-anchor="middle" fill="#8f4a2c">Claude</text>
  <text x="884" y="89" font-size="15" font-weight="700" text-anchor="middle" fill="#8f4a2c">the AI runs here</text>
  <text x="884" y="108" font-size="15" font-weight="700" text-anchor="middle" fill="#8f4a2c">on the internet</text>
  <line x1="990" y1="128" x2="990" y2="240" stroke="#b5643f" stroke-width="3" marker-start="url(#clay)" marker-end="url(#clay)"/>
  <g font-size="12" fill="#8f4a2c" text-anchor="end" transform="translate(70 0)">
    <text x="908" y="150">question, photos ↑</text>
    <text x="908" y="167">↓ tool to use, answer</text>
  </g>

  <!-- the network between the camera computer and the operator's computer -->
  <line x1="790" y1="306" x2="542" y2="306" stroke="#2f6fb5" stroke-width="3" marker-end="url(#blue)"/>
  <line x1="542" y1="354" x2="790" y2="354" stroke="#2f6fb5" stroke-width="3" marker-end="url(#blue)"/>
  <g font-size="13" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="5" stroke-linejoin="round">
    <text x="666" y="268" font-size="14" font-weight="700" fill="#2f6fb5">MCP, over the network</text>
    <text x="666" y="296">take a photo · look closer · record</text>
    <text x="666" y="344">photos · results · “confirm fail?”</text>
  </g>

</svg>
