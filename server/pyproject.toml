[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-inspection-camera"
version = "0.1.0"
description = "An MCP server that lets an AI application take photos with a camera and record inspection results"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]==2.3.0",
    "opencv-python-headless",
    "pillow",
]

[project.scripts]
inspection-camera = "inspection_camera.server:main"

[project.optional-dependencies]
test = ["pytest", "anyio"]

[tool.setuptools]
packages = ["inspection_camera"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
